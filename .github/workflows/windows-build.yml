name: Windows Build

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NeeView\NeeView.csproj

      - name: Build
        run: dotnet build NeeView\NeeView.csproj -c Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: NeeView-win-x64
          path: NeeView\bin\Release\net10.0-windows\win-x64
